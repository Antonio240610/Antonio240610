<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="50%" stop-color="#141b2e"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c7cfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8fa3d1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5c7cfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- montañas nórdicas de fondo -->
  <polygon points="0,220 120,90 220,220" fill="#1c2540" opacity="0.6"/>
  <polygon points="150,220 300,60 430,220" fill="#1a2038" opacity="0.7"/>
  <polygon points="380,220 500,100 620,220" fill="#1c2540" opacity="0.6"/>
  <polygon points="600,220 760,70 900,220" fill="#1a2038" opacity="0.7"/>
  <polygon points="820,220 930,110 1000,220" fill="#1c2540" opacity="0.5"/>

  <!-- runas decorativas -->
  <text x="60" y="60" font-family="Georgia, serif" font-size="26" fill="#5c7cfa" opacity="0.5">ᛟ</text>
  <text x="900" y="55" font-family="Georgia, serif" font-size="26" fill="#5c7cfa" opacity="0.5">ᚨ</text>
  <text x="940" y="180" font-family="Georgia, serif" font-size="22" fill="#5c7cfa" opacity="0.4">ᛗ</text>
  <text x="30" y="180" font-family="Georgia, serif" font-size="22" fill="#5c7cfa" opacity="0.4">ᚦ</text>

  <!-- linea de brillo -->
  <rect x="0" y="108" width="1000" height="2" fill="url(#glow)"/>

  <!-- texto principal -->
  <text x="500" y="105" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#e8ecf5" text-anchor="middle" letter-spacing="2">
    ANTONIO PAPADOPOLO
  </text>
  <text x="500" y="140" font-family="Georgia, serif" font-size="18" fill="#8fa3d1" text-anchor="middle" letter-spacing="4">
    DESARROLLADOR DE SOFTWARE · JUNIOR
  </text>

  <!-- hacha simple a cada lado -->
  <g transform="translate(150,140) rotate(-20)">
    <rect x="-2" y="-30" width="4" height="60" fill="#8fa3d1"/>
    <path d="M -2 -30 L -28 -18 L -20 -4 L -2 -8 Z" fill="#5c7cfa" opacity="0.8"/>
  </g>
  <g transform="translate(850,140) rotate(20) scale(-1,1)">
    <rect x="-2" y="-30" width="4" height="60" fill="#8fa3d1"/>
    <path d="M -2 -30 L -28 -18 L -20 -4 L -2 -8 Z" fill="#5c7cfa" opacity="0.8"/>
  </g>
</svg>
