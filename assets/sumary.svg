         y="-83.959976">WELCOME!</tspan></text><text
       xml:space="preserve"
       style="font-size:7.66687px;font-family:Berserker;-inkscape-font-specification:'Berserker, Normal';writing-mode:lr-tb;direction:ltr;fill:#ffffff;fill-opacity:1;stroke-width:0.099634"
