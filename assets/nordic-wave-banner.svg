<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;display=swap');
      .runic { font-family: 'Cinzel Decorative', 'Georgia', serif; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#1a2038"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- olas animadas -->
  <path fill="#243056" opacity="0.8">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,180 Q250,150 500,180 T1000,180 V220 H0 Z;
        M0,190 Q250,170 500,190 T1000,190 V220 H0 Z;
        M0,180 Q250,150 500,180 T1000,180 V220 H0 Z"/>
  </path>
  <path fill="#1a2340" opacity="0.9">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M0,200 Q250,175 500,200 T1000,200 V220 H0 Z;
        M0,205 Q250,190 500,205 T1000,205 V220 H0 Z;
        M0,200 Q250,175 500,200 T1000,200 V220 H0 Z"/>
  </path>

  <!-- runas laterales -->
  <text x="50" y="60" font-size="26" fill="#5c7cfa" opacity="0.5">ᛟ ᚨ ᛗ</text>
  <text x="850" y="60" font-size="26" fill="#5c7cfa" opacity="0.5">ᚦ ᛉ ᚱ</text>

  <!-- nombre con fuente rúnica -->
  <text x="500" y="100" class="runic" font-size="48" font-weight="700" fill="#e8ecf5" text-anchor="middle" letter-spacing="3">
    ANTONIO PAPADOPOLO
  </text>
  <text x="500" y="135" class="runic" font-size="18" fill="#8fa3d1" text-anchor="middle" letter-spacing="5">
    DESARROLLADOR DE SOFTWARE
  </text>
</svg>
